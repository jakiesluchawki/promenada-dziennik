name: Report size candidate checks
on:
  push:
    branches: [fix/report-size-2026-10-05]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
  existing-report-size:
    needs: synthetic-tests
    if: github.event.head_commit.message == 'Measure existing report size safely (2026-10-05)'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Measure existing ciphertext without collection or publication
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python scripts/measure_report_size.py
