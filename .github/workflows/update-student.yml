name: Update student school report
run-name: "${{ inputs.verify_recovery && 'Recovery verification' || inputs.scheduled && 'Scheduled report' || 'Manual report' }}"
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Skip Librus when this morning/evening already has healthy data'
        type: boolean
        default: false
      verify_recovery:
        description: 'Exercise fresh-runner recovery using the current healthy report (set scheduled=true)'
        type: boolean
        default: false
env:
  MAHBRUS_SCHEDULED: ${{ inputs.scheduled }}
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: promenada-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      ok: ${{ steps.receipt.outcome == 'success' || steps.guard.outputs.allowed == 'false' }}
      retryable: ${{ steps.collect.outputs.retryable || steps.probe.outputs.retryable }}
      recovery_since: ${{ steps.collect.outputs.recovery_since }}
    env:
      MAHBRUS_NETWORK_RECOVERY: 'false'
      MAHBRUS_RECOVERY_SINCE: ''
    timeout-minutes: 12
    environment: &pages_environment
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps: &report_steps
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # This diagnostic exercises job recovery without changing the report or logging in.
      - name: Exercise pre-login recovery without collecting
        id: probe
        if: inputs.verify_recovery && inputs.scheduled && env.MAHBRUS_NETWORK_RECOVERY != 'true'
        run: |
          echo 'retryable=true' >> "$GITHUB_OUTPUT"
          echo 'Synthetic pre-login failure; no Librus request was made.'
          exit 1
      - name: Limit repeated collection attempts
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          MAHBRUS_WORKFLOW: update-student.yml
        run: python scripts/dispatch_guard.py
      - name: Install collector dependencies
        run: python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Read the student account and encrypt its report
        id: collect
        if: steps.guard.outputs.allowed == 'true'
        env:
          LIBRUS_STUDENT_ACCOUNTS: ${{ secrets.LIBRUS_STUDENT_ACCOUNTS }}
          STUDENT_REFRESH_CONFIG: ${{ secrets.STUDENT_REFRESH_CONFIG }}
        run: python scripts/student_run.py
      - name: Save validated encrypted reports and attachment blobs
        if: steps.collect.outputs.due == 'true'
        run: |
          git config user.name "Promenada"
          git config user.email "promenada@users.noreply.github.com"
          python scripts/stage_site.py --git-add
          git commit -m "Refresh encrypted student report"
          git push origin main
      - name: Stage the current encrypted reports
        if: steps.guard.outputs.allowed == 'true'
        run: python scripts/stage_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.guard.outputs.allowed == 'true'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.guard.outputs.allowed == 'true'
        with:
          path: '_site'
          retention-days: 1
      - name: Publish the updated site
        id: deployment
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Surface collection problems
        if: steps.collect.outputs.due == 'true' && steps.collect.outputs.healthy != 'true'
        run: |
          echo "The published report contains an account warning. Check the private dashboard."
          exit 1
      - name: Verify fresh published report
        if: steps.guard.outputs.allowed == 'true'
        env:
          MAHBRUS_AUDIENCE: student
          LIBRUS_STUDENT_ACCOUNTS: ${{ secrets.LIBRUS_STUDENT_ACCOUNTS }}
        run: python scripts/verify_publication.py
      - name: Record verified publication
        if: steps.guard.outputs.allowed == 'true'
        run: |
          python - <<'PY'
          import json, os, pathlib
          receipt = {"v": 1, "verified": True, "run": os.environ["GITHUB_RUN_ID"], "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"])}
          pathlib.Path(os.environ["RUNNER_TEMP"], "mahbrus-publication.json").write_text(json.dumps(receipt))
          PY
      - name: Save publication verification receipt
        id: receipt
        if: steps.guard.outputs.allowed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mahbrus-verified-publication-v1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mahbrus-publication.json
          if-no-files-found: error
          retention-days: 1

  recover:
    name: One recovery on a fresh runner
    needs: report
    if: always() && !cancelled() && needs.report.outputs.ok != 'true' && needs.report.outputs.retryable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: *pages_environment
    env:
      MAHBRUS_NETWORK_RECOVERY: 'true'
      MAHBRUS_RECOVERY_SINCE: ${{ needs.report.outputs.recovery_since }}
    steps: *report_steps
  collection-failed:
    name: Report an unrecovered failure
    needs: report
    if: always() && !cancelled() && needs.report.outputs.ok != 'true' && needs.report.outputs.retryable != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo 'Report update failed; automatic login replay was not allowed. Previous data remains available.'
          exit 1
